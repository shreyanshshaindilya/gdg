<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" fill="none">
  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="#0f172a" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="64" rx="16" fill="#1e293b" />
  <circle cx="36" cy="32" r="6" fill="#ef4444" />
  <circle cx="56" cy="32" r="6" fill="#f59e0b" />
  <circle cx="76" cy="32" r="6" fill="#10b981" />
  <text x="110" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">QRCraft PRO | Real-Time Camera &amp; File Scanner</text>

  <!-- Navigation Tabs mock -->
  <rect x="480" y="14" width="240" height="36" rx="8" fill="#0f172a" />
  <text x="500" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Generate</text>
  <rect x="560" y="18" width="60" height="28" rx="6" fill="#4f46e5" />
  <text x="578" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Scan</text>
  <text x="640" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">History</text>

  <!-- Viewfinder Frame Left -->
  <g transform="translate(100, 100)">
    <rect width="480" height="480" rx="24" fill="#020617" stroke="#334155" stroke-width="2" />
    
    <!-- Viewfinder Reticle -->
    <rect x="100" y="100" width="280" height="280" rx="16" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
    
    <!-- Reticle corner brackets -->
    <path d="M 88 124 L 88 88 L 124 88" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 392 124 L 392 88 L 356 88" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 88 356 L 88 392 L 124 392" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 392 356 L 392 392 L 356 392" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Laser scanning line -->
    <line x1="90" y1="230" x2="390" y2="230" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />

    <text x="175" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Align QR code inside frame</text>
  </g>

  <!-- Scan Result Card Right -->
  <g transform="translate(640, 100)">
    <rect width="460" height="480" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#065f46" />
    <text x="36" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="20">✓</text>
    
    <text x="80" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">QR Detected &amp; Decoded</text>
    <text x="80" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Type: Wi-Fi Network</text>

    <!-- Details Box -->
    <rect x="24" y="90" width="412" height="150" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <text x="44" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Network (SSID)</text>
    <text x="260" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SRM_Campus_5G</text>

    <line x1="44" y1="140" x2="416" y2="140" stroke="#1e293b" stroke-width="1" />

    <text x="44" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Security Protocol</text>
    <text x="260" y="170" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">WPA2-PSK</text>

    <line x1="44" y1="185" x2="416" y2="185" stroke="#1e293b" stroke-width="1" />

    <text x="44" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Network Password</text>
    <text x="260" y="215" fill="#34d399" font-family="Courier, monospace" font-size="13" font-weight="bold">SrmIST#2026</text>

    <!-- Raw text box -->
    <text x="24" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RAW DECODED STRING</text>
    <rect x="24" y="285" width="412" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="36" y="315" fill="#cbd5e1" font-family="Courier, monospace" font-size="11">WIFI:T:WPA;S:SRM_Campus_5G;P:SrmIST#2026;H:false;;</text>

    <!-- Action Buttons -->
    <rect x="24" y="365" width="412" height="44" rx="10" fill="#059669" />
    <text x="155" y="392" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Copy Wi-Fi Password</text>

    <rect x="24" y="420" width="195" height="40" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="75" y="445" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Copy Payload</text>

    <rect x="240" y="420" width="195" height="40" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="270" y="445" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Edit in Generator</text>
  </g>
</svg>
